[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-profiles"
version = "0.1.0"
description = "Private, local-only Windows tray app for switching between and monitoring Claude Code accounts via claude-swap."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["PySide6>=6.11,<7"]
keywords = ["claude", "claude-code", "claude-swap", "windows", "system-tray", "multi-account", "usage-monitor", "pyside6"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kevinabouhanna/claude-profiles-windows"
Issues = "https://github.com/kevinabouhanna/claude-profiles-windows/issues"

[project.scripts]
claude-profiles = "claude_profiles.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_profiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: talks to the real claude-swap; read-only, needs --run-integration",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["claude_profiles"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
